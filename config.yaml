# Project configuration: the single place to change paths, time windows and business assumptions.
#
# Data location: by default the raw Kaggle parquet files are read in place from the shared datasets folder.
# To point somewhere else, either edit `data_dir` below or set the environment variable HC_DATA_DIR
# (it overrides this file), e.g.  HC_DATA_DIR=/data/home-credit-2024/parquet_files/train make all
data_dir: ~/projects/data-projects/datasets/p2-comp-home-credit-2024/parquet_files/train

# Local outputs (git-ignored). Relative paths are resolved from the repository root.
warehouse: data/warehouse.duckdb
processed_dir: data/processed
artifacts_dir: artifacts
reports_dir: reports

seed: 42

duckdb:
  threads: 8
  memory_limit: 8GB

# Time-based split on decision month (YYYYMM, inclusive). No random split for fitting, calibrating or testing the credit models;
# the only random split is inside the fair-lending proxy check (src/fairness.py, 70/30 within the training window), which predicts
# sex and age band, not default.
split:
  train:   [201901, 201910]   # model fitting
  valid:   [201911, 201912]   # early stopping, calibration, cut-off selection
  test:    [202001, 202003]   # out-of-time test: every headline number comes from here
  monitor: [202004, 202010]   # post-"deployment" window used to demonstrate monitoring (after the April 2020 break)

# Unit economics per currency unit of loan amount (see docs/assumptions.md for sources and ranges).
#   cost of approving a bad applicant (FN)  = ead_share x lgd = 0.80 x 0.75 = 60% of the loan amount
#   cost of declining a good applicant (FP) = the product's net lifetime margin
#   break-even PD per product = margin / (margin + 0.60)  ->  cash 25.0%, revolving 14.3%, point-of-sale 7.7%
economics:
  ead_share: 0.80        # share of the loan amount still outstanding when a default happens
  lgd: 0.75              # share of that exposure never recovered
  margin_by_product:     # net lifetime profit of a loan that is repaid, share of the loan amount
    # Derivation (assumptions, docs/assumptions.md E1): cash = lifetime interest ~49% of principal (median rate 42% a year x 24 months)
    #   - ~25% of that for early repayment - ~7% funding (6% a year on ~60% average balance for ~2 years) - ~5% operating and
    #   acquisition cost = ~25%, rounded down to 20%; point-of-sale = lifetime interest ~12.5% (42% are 0%-interest promotions)
    #   - early repayment - ~3% funding - ~4% operating cost + ~2% merchant and insurance income = ~5%.
    CAL: 0.20            # cash loans
    COL: 0.05            # point-of-sale loans
    REL: 0.10            # revolving cards: no rate in the data; amount is the credit limit
  margin_default: 0.10   # any loan without a product type (1 case)

# Manual review assumptions for the 3-tier policy (all adjustable in the dashboard).
review:
  cost_per_case: 300           # currency units per reviewed application (about 1% of the median loan; ~20-30 minutes of an underwriter's time)
  bad_catch_rate: 0.40         # share of bad applicants that a reviewer declines
  good_decline_rate: 0.10      # share of good applicants that a reviewer declines anyway
  capacity_share: 0.05         # review team capacity as a share of monthly applications

# Proposed policy thresholds (not estimated from the data; to be agreed with Model Risk and Credit Policy before go-live).
# Documented in docs/model_card.md (monitoring plan) and docs/cutoff_and_swap_set.md (trial rules).
proposals:
  early_delinquency_investigate: 0.20   # 30+ DPD at month 3 on book, relative excess over the level expected from the PDs
  early_delinquency_act: 0.40           # same measure; also the trial's stop rule
  trial_bad_rate_tolerance_pp: 0.2      # champion/challenger trial: the challenger arm's bad rate may not exceed the champion arm's by more
